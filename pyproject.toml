[project]
name = "trail-scorer-audit"
version = "0.1.0"
description = "Audits the scoring code behind the TRAIL agent-trace benchmark, using their unmodified scorer and no model calls"
requires-python = ">=3.12"
dependencies = [
    # Not this project's imports. These three are what
    # benchmarking/calculate_scores.py imports at module level, and the audit
    # loads that file from a pinned clone without touching a line of it, so the
    # import fails without them. Pinned exactly rather than floated because the
    # audit's whole argument is that a published number should reproduce, and a
    # scoring function whose dependencies drift under it is the thing being
    # complained about.
    "numpy==2.3.5",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Enforces constraint 4 rather than trusting it: --disable-socket makes any
    # accidental network call a test failure.
    "pytest-socket>=0.7.0",
    "ruff>=0.6.0",
]

[project.scripts]
trailaudit = "trailaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"
pythonpath = ["scripts"]
markers = [
    "upstream: needs the pinned trail-benchmark clone that `trailaudit fetch` writes",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# BLE catches the blanket `except Exception` that the style rules ban outright.
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
